{{ define "content" }}

<div class="container inner">

  <h2>Sliders</h2>

  <a href="/admin/sliders/create" class="btn btn-primary">
    Create New Slider
  </a>

  <br><br>

  {{ if .Error }}

  <div class="alert alert-danger">
    {{ .Error }}
  </div>

  {{ end }}

  <table class="table table-bordered">

    <thead>

      <tr>
        <th>ID</th>
        <th>Image</th>
        <th>Title</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>

    </thead>

    <tbody>

      {{ range .Sliders }}

      <tr>

        <td>{{ .ID }}</td>

        <td>
          <img src="/{{ .Image }}" width="150">
        </td>

        <td>{{ .Title }}</td>

        <td>{{ .Status }}</td>

        <td>

          <a href="/admin/sliders/edit/{{ .ID }}" class="btn btn-sm btn-warning">
            Edit
          </a>

          <a href="/admin/sliders/delete/{{ .ID }}" class="btn btn-sm btn-danger"
            onclick="return confirm('Delete slider?')">
            Delete
          </a>

        </td>

      </tr>

      {{ else }}

      <tr>
        <td colspan="5">No sliders found</td>
      </tr>

      {{ end }}

    </tbody>

  </table>

</div>

{{ end }}
