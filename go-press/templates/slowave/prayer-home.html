{{ define "content" }}

<div class="light-wrapper page-title">
  <div class="container inner">
    <h1 class="pull-left">{{ .Greeting }}</h1>
  </div>
</div>

<div class="dark-wrapper">
  <div class="container inner text-center">

    <div class="section-title">
      <h3 class="text-uppercase">Total Prayer Time</h3>
      <h1 class="thin" style="font-size: 64px; margin-top: 10px;">{{ .TotalTime }}</h1>
    </div>

    <div id="liveTimerContainer" style="display: none; margin-bottom: 30px;">
      <h3 class="text-blue">Current Session</h3>
      <h1 id="liveTimer" class="thin" style="font-size: 52px; color: #3f8dbf;">00:00:00</h1>
    </div>

    <div class="divide30"></div>

    <div class="row">
      <div class="col-sm-4">
        <div class="stat-item">
          <h4 class="text-uppercase">Active Users</h4>
          <h2 class="thin">{{ .ActiveUsers }}</h2>
        </div>
      </div>

      <div class="col-sm-4">
        <div class="stat-item">
          <h4 class="text-uppercase">Countries</h4>
          <h2 class="thin">{{ .Countries }}</h2>
        </div>
      </div>

      <div class="col-sm-4">
        <div class="stat-item">
          <h4 class="text-uppercase">Cities</h4>
          <h2 class="thin">{{ .Cities }}</h2>
        </div>
      </div>
    </div>

    <div class="divide50"></div>

    <p class="lead larger">
      “Where two or three gather in prayer, power is released.”
    </p>

    <div class="divide30"></div>

    <div class="row">
      <div class="col-md-12 text-center">
        <form method="POST" action="/prayer/start" style="display: inline-block; margin: 5px;">
          <button type="submit" class="btn btn-large btn-blue">🙏 Prayer Now</button>
        </form>

        <form method="POST" action="/prayer/end" style="display: inline-block; margin: 5px;">
          <input type="hidden" name="session_id" value="{{ .SessionID }}">
          <button type="submit" class="btn btn-large btn-red">⏹ End Prayer</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
  setInterval(() => {
    fetch("/prayer/heartbeat", { method: "POST" });
  }, 10000);
</script>

<script type="application/json" id="session-data">
{
  "active": {{ .SessionActive }},
  "start": {{ .SessionStart }}
}
</script>

<script>
  const el = document.getElementById('session-data');

  let sessionActive = false;
  let sessionStart = 0;

  if (el) {
    try {
      const data = JSON.parse(el.textContent);
      sessionActive = data.active;
      sessionStart = data.start;
    } catch (e) {
      console.error("Invalid session data", e);
    }
  }

  function formatTime(seconds) {
    const h = String(Math.floor(seconds / 3600)).padStart(2, '0');
    const m = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
    const s = String(seconds % 60).padStart(2, '0');
    return `${h}:${m}:${s}`;
  }

  if (sessionActive && sessionStart > 0) {
    const container = document.getElementById("liveTimerContainer");
    const timerEl = document.getElementById("liveTimer");

    if (container && timerEl) {
      container.style.display = "block";

      setInterval(() => {
        const now = Math.floor(Date.now() / 1000);
        const elapsed = now - sessionStart;
        timerEl.innerText = formatTime(elapsed);
      }, 1000);
    }
  }

  // heartbeat (leave as is)
  setInterval(() => {
    fetch("/prayer/heartbeat", { method: "POST" });
  }, 10000);
</script>

{{ end }}
